name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Unit Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies (headless OpenCV)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-glx \
            libglib2.0-0 \
            libsm6 \
            libxext6 \
            libxrender-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Install headless OpenCV (no GUI, safe for CI)
          pip install opencv-contrib-python-headless
          # Core scientific stack
          pip install numpy scipy matplotlib sympy tqdm pyyaml
          # VO-specific
          pip install graphslam
          # Test runner
          pip install pytest pytest-cov

      - name: Install package in editable mode
        run: pip install -e .

      - name: Run unit tests with coverage
        run: |
          pytest tests/ -v \
            --tb=short \
            --cov=vo \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: matrix.python-version == '3.11'
        with:
          files: coverage.xml
          fail_ci_if_error: false

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install ruff
        run: pip install ruff

      - name: Run ruff linter
        run: ruff check vo/ scripts/ tests/ --select=E,F,W --ignore=E501,E402,F401

  smoke-test:
    name: Smoke Test (synthetic frames)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1-mesa-glx libglib2.0-0
          pip install --upgrade pip
          pip install opencv-contrib-python-headless numpy scipy matplotlib sympy tqdm pyyaml graphslam pytest
          pip install -e .

      - name: Run synthetic VO smoke test
        run: python tests/smoke_test.py
